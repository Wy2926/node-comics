# Used with the root compose.yaml by scripts/start-local-classic.ps1.
x-classic: &classic
  CLASSIC_ENABLED: "true"
  CLASSIC_ENGINE_VERSION: "${CLASSIC_ENGINE_VERSION:?Run the local classic launcher first}"

services:
  api:
    environment: *classic
  maintenance:
    environment: *classic
  control-worker:
    environment: *classic
  api-tls:
    extends:
      file: compose.yaml
      service: api
    environment: *classic
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8443", --no-access-log,
              --ssl-certfile, /run/classic-tls/server.pem, --ssl-keyfile, /run/classic-tls/server.key]
    ports: !override ["127.0.0.1:18443:8443"]
    volumes:
      - ./data/classic-local/tls:/run/classic-tls:ro
    healthcheck:
      test: [CMD, python, -c, "import ssl,urllib.request; urllib.request.urlopen('https://localhost:8443/health/ready', context=ssl.create_default_context(cafile='/run/classic-tls/ca.pem'), timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
