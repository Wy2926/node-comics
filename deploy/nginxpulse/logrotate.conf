/var/log/nginx/nginxpulse/*.access.log {
    daily
    rotate 7
    maxage 7
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data adm
    sharedscripts
    postrotate
        /usr/sbin/nginx -s reopen
    endscript
}
/var/log/nodelane-nginx-errors/error.log {
    daily
    rotate 7
    maxage 7
    missingok
    notifempty
    compress
    delaycompress
    create 0640 nodelane-nginx-errors www-data
}
