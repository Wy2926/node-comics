# http context. No query strings, cookies, authorization, or private resource IDs.
map $http_referer $traffic_referrer {
    default "-";
    ~^https?://([^/@:]+)(?::[0-9]+)?(?:/|$) $1;
}
map $uri $traffic_route {
    include /etc/nodelane/traffic-private-route.map;
    default $uri;
    ~^/(?:[a-z][a-z](?:-[a-z][a-z])?/)?(auth|account|payment|drive-connect)(/|$) /$1/:private;
    ~^/v1/admin/([^/]+) /v1/admin/$1/:private;
    ~^/v1/(guest/)?translations/events$ /v1/translations/events;
    ~^/v1/(guest/)?translations/[^/]+/([^/]+)$ /v1/$1translations/:id/$2;
    ~^/v1/(guest/)?translations/[^/]+$ /v1/$1translations/:id;
    ~^/v1/documents/[^/]+/([^/]+)$ /v1/documents/:id/$1;
    ~^/v1/documents/[^/]+$ /v1/documents/:id;
    ~^/internal/(documents/)?compute/(v[0-9]+)/(nodes|leases)/[^/]+/([^/]+)$ /internal/$1compute/$2/$3/:id/$4;
}
map $host $traffic_path {
    default /:private;
    comics.nodelane.net $traffic_route;
    comics-a.nodelane.net $traffic_route;
}
# Only server-rendered public HTML is a page view. Prefetches do not count.
map "$host:$request_method:$status:$sent_http_content_type" $traffic_html {
    default 0;
    ~^comics\.nodelane\.net:GET:(200|304):text/html 1;
}
map "$http_purpose:$http_sec_purpose" $traffic_prefetch {
    default 0;
    ~*prefetch 1;
}
map $uri $traffic_kind {
    include /etc/nodelane/traffic-private-kind.map;
    default web;
    ~^/traffic(/|$) private;
    ~^/health(/|$) probe;
    ~^/v1/translations/events$ stream;
    ~^/internal/(documents/)?compute/v[0-9]+/nodes/[^/]+/updates$ stream;
    ~^/(v1|internal|webhooks|billing)(/|$) api;
    ~^/(?:[a-z][a-z](?:-[a-z][a-z])?/)?(auth|account|payment|drive-connect)(/|$) private;
}
map "$host:$traffic_kind" $traffic_service {
    default 0;
    ~^auth(-admin)?\.nodelane\.net: 1;
    ~:api$ 1;
}
map "$traffic_html:$traffic_kind:$traffic_prefetch" $traffic_page {
    default 0;
    "1:web:0" 1;
}
map "$remote_addr:$http_user_agent:$traffic_kind" $traffic_loggable {
    default 1;
    ~^127\.0\.0\.1: 0;
    ~^::1: 0;
    ~:NodeLane-Traffic-Probe/ 0;
    ~:(private|probe)$ 0;
}
map "$traffic_loggable:$traffic_page" $traffic_log_page { default 0; "1:1" 1; }
map "$traffic_loggable:$host:$traffic_kind" $traffic_log_web { default 0; "1:comics.nodelane.net:web" 1; }
map "$traffic_loggable:$traffic_service" $traffic_log_service { default 0; "1:1" 1; }
map "$traffic_loggable:$traffic_kind" $traffic_log_stream { default 0; "1:stream" 1; }
log_format nodelane_traffic escape=json
    '$remote_addr [$time_iso8601] "$request_method $traffic_path $server_protocol" '
    '$status $body_bytes_sent "$traffic_referrer" "$http_user_agent" '
    '$request_time "$upstream_response_time" $host $connection';
