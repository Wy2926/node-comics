log-format %h [%x] "%r" %s %b "%R" "%u" %T "%^" %v %^
datetime-format %Y-%m-%dT%H:%M:%S%z
no-global-config true
no-query-string true
no-term-resolver true
no-progress true
http-method yes
http-protocol no
jobs 1
max-items 200
html-prefs {"theme":"bright","perPage":20,"layout":"horizontal","showTables":true}
