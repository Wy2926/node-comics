# Existing OpenResty uses host networking. Install under its conf.d directory.
# Certificate paths refer to the VPS's existing wildcard origin certificate.
upstream comics_api {
    include /www/node-comics/active/api.inc;
    keepalive 32;
}
server {
    listen 80;
    server_name comics.nodelane.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name comics.nodelane.net;
    ssl_certificate /www/sites/auth/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/auth/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Trust visitor addresses only from Cloudflare's published edge networks.
    # Keep both lists aligned with https://www.cloudflare.com/ips-v4/ and /ips-v6/.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # Avoid logging OIDC authorization codes and private image addresses.
    access_log off;
    error_log /var/log/nginx/node-comics-error.log crit;
    client_max_body_size 132m;
    client_body_timeout 120s;

    # Shared website/Picker tokens can be released without rebuilding the API.
    location = /design-tokens.css {
        alias /www/sites/comics-drive-connect/design-tokens.css;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-store, no-transform" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Only these four public Picker assets are served; config.js is deployed
    # separately from private settings. No directory browsing or request logs.
    location ~ ^/drive-connect/(index\.html|style\.css|connect\.js|config\.js)$ {
        alias /www/sites/comics-drive-connect/$1;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-store, no-transform" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location /drive-connect/ { return 404; }

    # Static release directories are immutable and independent of Python images.
    include /www/node-comics/active/website.inc;
    include /www/node-comics/active/admin.inc;
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location ~ ^/(v1|internal|webhooks|billing|health)(/|$) {
        include /www/node-comics/openresty.api.inc;
    }
    location = /docs { include /www/node-comics/openresty.api.inc; }
    location = /docs/oauth2-redirect { include /www/node-comics/openresty.api.inc; }
    location = /redoc { include /www/node-comics/openresty.api.inc; }
    location = /openapi.json { include /www/node-comics/openresty.api.inc; }
}
