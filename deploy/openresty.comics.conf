# Existing OpenResty uses host networking. Install under its conf.d directory.
# Certificate paths refer to the VPS's existing wildcard origin certificate.
server {
    listen 80;
    server_name comics.nodelane.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name comics.nodelane.net;
    ssl_certificate /www/sites/auth/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/auth/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Avoid logging OIDC authorization codes and private image addresses.
    access_log off;
    error_log /var/log/nginx/node-comics-error.log crit;
    client_max_body_size 96m;
    client_body_timeout 120s;

    # Shared website/Picker tokens can be released without rebuilding the API.
    location = /design-tokens.css {
        alias /www/sites/comics-drive-connect/design-tokens.css;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-store, no-transform" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Only these four public Picker assets are served; config.js is deployed
    # separately from private settings. No directory browsing or request logs.
    location ~ ^/drive-connect/(index\.html|style\.css|connect\.js|config\.js)$ {
        alias /www/sites/comics-drive-connect/$1;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-store, no-transform" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location /drive-connect/ { return 404; }

    # The same backend origin serves the static website and /v1 API.
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        # Image bytes stream through the API; never spool them to server disk.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
