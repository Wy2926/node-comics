name: node-comics-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Application lifecycle only. PostgreSQL, Redis, network and storage are external.
# Select a service explicitly. Never use project-wide down during releases.
x-server: &server
  env_file: [.env.server]
  environment:
    APP_ENV: production
    DEV_AUTH: "false"
    DEV_AUTH_SECRET: ""
    SERVE_STATIC: "false"
    STORAGE_PATH: /data/translation
    TMPDIR: /data/translation/staging
  networks: [infrastructure]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700,size=32m
  volumes:
    - translation_files:/data/translation
  restart: unless-stopped
  logging: *logging

x-api: &api
  <<: *server
  command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --no-access-log, --proxy-headers, --forwarded-allow-ips, "*"]
  stop_grace_period: 31m
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
    interval: 10s
    timeout: 6s
    retries: 6
    start_period: 20s

services:
  api-blue:
    <<: *api
    profiles: [blue]
    image: ${BLUE_IMAGE:?Set immutable blue image}
    ports: ["127.0.0.1:${BLUE_PORT:-18088}:8000"]
  api-green:
    <<: *api
    profiles: [green]
    image: ${GREEN_IMAGE:?Set immutable green image}
    ports: ["127.0.0.1:${GREEN_PORT:-18089}:8000"]
  migrate:
    <<: *server
    profiles: [migration]
    image: ${MIGRATION_IMAGE:?Set reviewed migration image}
    command: [python, -m, app.migrate]
    restart: "no"
  control-worker:
    <<: *server
    profiles: [background]
    image: ${WORKER_IMAGE:?Set worker image}
    command: [python, -m, app.workers]
    stop_grace_period: 31m
    healthcheck:
      test: [CMD, python, -m, app.health, control-worker]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
  maintenance:
    <<: *server
    profiles: [background]
    image: ${MAINTENANCE_IMAGE:?Set maintenance image}
    command: [python, -m, app.dispatcher]
    stop_grace_period: 31m
    healthcheck:
      test: [CMD, python, -m, app.health, maintenance]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  infrastructure:
    external: true
    name: ${INFRA_NETWORK:-1panel-network}

volumes:
  translation_files:
    external: true
    name: ${TRANSLATION_VOLUME:?Set EXISTING shared translation volume}
