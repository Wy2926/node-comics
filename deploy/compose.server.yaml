name: node-comics-production

# Only the control plane. PostgreSQL is an existing external service;
# image engines and compute agents run on the operator's own machines.
x-server: &server
  image: ${SERVER_IMAGE:?Set SERVER_IMAGE to a versioned backend image}
  env_file: [.env.server]
  environment:
    APP_ENV: production
    DEV_AUTH: "false"
    DEV_AUTH_SECRET: ""
    RESULT_STORAGE_BACKEND: r2
    STORAGE_PATH: /data/images
  networks: [infrastructure, admission]
  depends_on:
    redis: {condition: service_healthy}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700,size=32m
    - /data/images:uid=10001,gid=10001,mode=0700,size=32m
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  redis:
    image: redis:8.2-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, "${REDIS_MAX_MEMORY:-256mb}", --maxmemory-policy, noeviction]
    networks: [admission]
    volumes: [admission_redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    <<: *server
    # Proxy headers are trusted only within this private control-plane boundary.
    # Keep the host port loopback-only; OpenResty must overwrite incoming XFF.
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --no-access-log, --proxy-headers, --forwarded-allow-ips, "*"]
    ports: ["127.0.0.1:${API_PORT:-18088}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 120s
  control-worker:
    <<: *server
    command: [python, -m, app.workers]
    stop_grace_period: 31m
    healthcheck:
      test: [CMD, python, -m, app.health, control-worker]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
  maintenance:
    <<: *server
    command: [python, -m, app.dispatcher]
    healthcheck:
      test: [CMD, python, -m, app.health, maintenance]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  admission:
    internal: true
  infrastructure:
    external: true
    name: ${INFRA_NETWORK:-1panel-network}

volumes:
  admission_redis:
