worker_processes auto;
pid /tmp/nginx.pid;
# Nginx error context can include signed payment/OIDC query strings too.
error_log /dev/null;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy no-referrer always;
        client_max_body_size 30m;
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }
        location ~ ^/(v1/(admin|dev|compute|internal)(/|$)|v1/auth/dev(/|$)|internal(/|$)|health(/|$)|docs(/|$)|redoc(/|$)|openapi\.json$) { return 404; }
        location ~ /\. { return 404; }
        location / {
            # Runtime DNS permits restarting the API without restarting the tunnel.
            set $application http://api:8000;
            proxy_pass $application;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 65s;
            proxy_buffering off;
        }
    }
}
