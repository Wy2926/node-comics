[program:node-comics]
command=/opt/node/venv/bin/python -m classic_node run --config /var/lib/node-comics/node.json --bundle-root /opt/node
directory=/var/lib/node-comics
user=node-comics
environment=PYTHONPATH="/opt/node/engine",PYTHONDONTWRITEBYTECODE="1",PYTHONUNBUFFERED="1",PYTHONUTF8="1",HOME="/var/lib/node-comics"
umask=0077
autostart=true
autorestart=unexpected
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/lib/node-comics/supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
