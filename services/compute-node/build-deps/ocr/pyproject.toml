[project]
name = "node-comics-ocr-build"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["torch==2.4.1+cpu", "pnnx==20260526", "onnx==1.17.0", "numpy==1.26.4", "opencv-python==4.10.0.84", "einops==0.8.1"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
