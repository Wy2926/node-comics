[project]
name = "node-comics-lama-build"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["torch==2.6.0+cpu", "onnx==1.23.0", "numpy==2.5.3"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
