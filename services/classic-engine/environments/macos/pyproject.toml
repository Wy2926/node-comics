[project]
name = "node-comics-macos-environment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "node-comics-classic-engine",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "onnxruntime==1.23.2",
]

[dependency-groups]
build = ["setuptools==84.0.0", "wheel==0.45.1"]
test = ["pytest==8.4.2", "cryptography==50.0.1"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
exclude-dependencies = ["onnxruntime-gpu", "onnxruntime-directml"]
override-dependencies = [
    "torch @ https://files.pythonhosted.org/packages/4b/3c/379349820e9a6e713826de3d0b88f07728541bdcabe2a3afd128871cdc4b/torch-2.14.1-cp312-cp312-macosx_14_0_arm64.whl",
    "torchvision @ https://files.pythonhosted.org/packages/f3/f8/855c7b326ed17a8dac4a03e8e6fec33ef6728e4baa00d816cf1227bb6681/torchvision-0.29.1-cp312-cp312-macosx_14_0_arm64.whl",
    "pydensecrf @ https://github.com/hgmzhn/pydensecrf/releases/download/v1.0.0/pydensecrf-1.0-cp312-cp312-macosx_10_13_universal2.whl",
]

[tool.uv.sources]
# Reuse shared requirements with Apple's native PyTorch wheels from PyPI.
# Run python -m classic_node from the classic-engine directory.
node-comics-classic-engine = { path = "../..", package = false }
comic-document-files = { path = "../../../../backend/document_files" }
