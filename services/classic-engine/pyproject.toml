[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "node-comics-classic-engine"
version = "0.1.0"
description = "Node Comics compute v3 adapter for Manga Translator UI on NVIDIA CUDA"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
dependencies = [
    "torch==2.13.0", "torchvision==0.28.0", "numpy>=2,<2.3",
    "opencv-python>=4.11", "Pillow==12.3.0", "PyQt6==6.9.1",
    "PyHyphen==4.0.4", "fonttools>=4.60,<5", "langcodes==3.5.0",
    "ultralytics==8.4.14", "timm==1.0.19", "einops==0.8.1",
    "networkx==3.5", "shapely==2.1.1", "scipy==1.16.1",
    "scikit-image==0.25.2", "pyclipper==1.3.0.post6", "py3langid==0.2.2",
    "pydantic==2.11.7", "omegaconf==2.3.0", "colorama==0.4.6", "pydensecrf==1.0",
    "python-dotenv==1.2.2", "regex", "tqdm==4.67.1",
    "requests>=2.32", "psutil>=7", "portalocker>=3", "httpx==0.28.1",
    "pillow-jxl-plugin==1.3.8", "natsort==8.4.0", "ordered-set==4.1.0",
    "python-docx==1.2.0", "docx2txt==0.9", "piexif==1.1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
classic-node = "classic_node.__main__:main"

[tool.setuptools.packages.find]
include = ["mtu_engine*", "classic_node*"]

[tool.setuptools.package-data]
mtu_engine = ["upstream.lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
pydensecrf = [
    { url = "https://github.com/hgmzhn/manga-translator-ui/releases/download/v1.7.6/pydensecrf-1.0-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'" },
    { url = "https://github.com/hgmzhn/pydensecrf/releases/download/v1.0.0/pydensecrf-1.0-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]
