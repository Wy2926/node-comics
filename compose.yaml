name: node-comics-nodes

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  build: ./backend
  image: node-comics-backend:cluster
  env_file: [.env, "${COMICS_ENV_FILE:-deploy/.env.local}"]
  environment: &backend-env
    APP_ENV: "${APP_ENV:-production}"
    DATABASE_URL: postgresql+psycopg://nodecomics:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nodecomics_cluster}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    REDIS_NAMESPACE: ${REDIS_NAMESPACE:-node-comics}
    STORAGE_PATH: /data/translation
    TMPDIR: /data/translation/staging
    DEV_AUTH: "${DEV_AUTH:-false}"
    DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:-}
    CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:18089,http://127.0.0.1:18089}"
  volumes:
    - translation_files:/data/translation
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped
  logging: *logging

services:
  redis:
    logging: *logging
    image: redis:8.2-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, "${REDIS_MAX_MEMORY:-256mb}", --maxmemory-policy, noeviction]
    volumes: [nodes_redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  postgres:
    logging: *logging
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: nodecomics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nodecomics_cluster}
    volumes:
      - nodes_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nodecomics -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    <<: *backend
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
    ports: ["127.0.0.1:${API_PORT:-18088}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
  maintenance:
    <<: *backend
    command: [python, -m, app.dispatcher]
    healthcheck:
      test: [CMD, python, -m, app.health, maintenance]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
  control-worker:
    <<: *backend
    command: [python, -m, app.workers]
    stop_grace_period: 31m
    healthcheck:
      test: [CMD, python, -m, app.health, control-worker]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  nodes_postgres:
  nodes_redis:
  translation_files:
