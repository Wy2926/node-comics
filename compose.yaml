name: node-comics-nodes

x-backend: &backend
  build: ./backend
  image: node-comics-backend:cluster
  env_file: [.env, "${COMICS_ENV_FILE:-deploy/.env.local}"]
  environment: &backend-env
    APP_ENV: "${APP_ENV:-production}"
    DATABASE_URL: postgresql+psycopg://nodecomics:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nodecomics_cluster}
    RESULT_STORAGE_BACKEND: r2
    STORAGE_PATH: /data/images
    DEV_AUTH: "${DEV_AUTH:-false}"
    DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:-}
    CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:18089,http://127.0.0.1:18089}"
  tmpfs:
    - /data/images:uid=10001,gid=10001,mode=0700,size=32m
  depends_on:
    postgres: {condition: service_healthy}
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: nodecomics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nodecomics_cluster}
    volumes:
      - nodes_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nodecomics -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    <<: *backend
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
    ports: ["127.0.0.1:${API_PORT:-18088}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
  maintenance:
    <<: *backend
    command: [python, -m, app.dispatcher]
    healthcheck:
      test: [CMD, python, -m, app.health, maintenance]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
  control-worker:
    <<: *backend
    command: [python, -m, app.workers]
    stop_grace_period: 31m
    healthcheck:
      test: [CMD, python, -m, app.health, control-worker]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
  classic-engine:
    profiles: [classic]
    build: ./services/classic-engine
    image: node-comics-classic-engine:cluster
    environment:
      ENGINE_TOKEN: ${CLASSIC_ENGINE_TOKEN}
      ENGINE_CONFIG_FILE: /config/engine.json
    volumes:
      - comics_models:/models
      - device_locks:/locks
      - ./deploy/engine.json:/config/engine.json:ro
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['ready']"]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 10m
    restart: unless-stopped
  compute-agent:
    profiles: [classic]
    build: ./services/compute-agent
    image: node-comics-compute-agent:cluster
    environment:
      CONTROL_URL: http://api:8000
      CONTROL_ALLOW_HTTP: "true"
      NODE_TOKEN: ${NODE_TOKEN:-}
      NODE_ID: ${NODE_ID:-}
      ENGINE_URL: http://classic-engine:8000
      ENGINE_TOKEN: ${CLASSIC_ENGINE_TOKEN}
    depends_on:
      classic-engine: {condition: service_healthy}
      api: {condition: service_started}
    stop_grace_period: 16m
    restart: unless-stopped
volumes:
  nodes_postgres:
  comics_models:
  device_locks:
